services:
  postgres:
    image: postgres:16
    container_name: weather_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - weather_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_user -d weather_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloudbeaver:
    image: dbeaver/cloudbeaver:24.2.5
    container_name: weather_cloudbeaver
    restart: unless-stopped
    ports:
      - "${CLOUDBEAVER_PORT}:8978"
    depends_on:
      - postgres
    volumes:
      - ./cloudbeaver/connections:/opt/cloudbeaver/conf/connections
      - ./cloudbeaver/workspace:/opt/cloudbeaver/workspace
    networks:
      - weather_network


  ingestion:
    build:
      context: ./ingestion
    container_name: weather_ingestion
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - weather_network


  dbt:
    build:
      context: ./dbt
    container_name: weather_dbt
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - weather_network

  dbt-docs:
    build:
      context: ./dbt
    container_name: weather_dbt_docs
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dbt:/dbt
    ports:
      - "${DBT_DOCS_PORT}:8080"
    command:
      >
      sh -c "
      dbt docs generate &&
      dbt docs serve
      --host 0.0.0.0
      --port 8080
      "
    networks:
      - weather_network

volumes:
  postgres_data:

networks:
  weather_network:
    external: true
    name: ${DOCKER_NETWORK:-data-platform}

