version: 2

models:
  - name: stg_weather
    description: >
      Cleaned weather observations enriched with API request metadata.
      This is an intermediate staging model; use fact_weather_observation
      in analytics schema for analysis.
    columns:
      - name: weather_id
        description: Unique identifier for each weather observation.
        data_tests:
          - unique
          - not_null
      - name: request_id
        description: Foreign key to the originating API request.
        data_tests:
          - not_null
      - name: observation_time
        description: Timestamp of the weather observation.
        data_tests:
          - not_null
      - name: latitude
        description: Latitude of the observation.
        data_tests:
          - not_null
      - name: longitude
        description: Longitude of the observation.
        data_tests:
          - not_null
      - name: temperature
        description: Air temperature in degrees Celsius.
        data_tests:
          - not_null
      - name: apparent_temperature
        description: Apparent (feels like) temperature in degrees Celsius.
      - name: precipitation
        description: Precipitation amount in millimeters.
      - name: wind_speed
        description: Wind speed in kilometers per hour.
      - name: weather_code
        description: WMO weather condition code.
      - name: ingested_at
        description: Timestamp when the record was loaded into PostgreSQL.
      - name: request_time
        description: Timestamp when the source API request was made.

