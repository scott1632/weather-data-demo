version: 2

models:
  - name: stg_weather_requests
    description: >
      Cleaned staging model representing API requests.
    columns:
      - name: request_id
        description: Primary key for the API request.
        data_tests:
          - unique
          - not_null
      - name: requested_at
        description: Time the API request was made.
        data_tests:
          - not_null

